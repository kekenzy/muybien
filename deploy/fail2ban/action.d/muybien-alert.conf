# 遮断したときにメールで知らせる（コンテナ内の /opt/muybien-alert にスクリプトをマウントしている）

[Definition]
actionstart =
actionstop =
actioncheck =
actionban = python3 /opt/muybien-alert/muybien_alert.py --env-file /opt/muybien-env/.env.prod --state-dir /var/lib/muybien-alert ban --kind <kind> --jail <name> --ip <ip> --failures <failures> --bantime <bantime>
actionunban =

[Init]
kind = intrusion
name = default

# ログイン・パスワード再設定・初回パスワード設定の失敗（nginx の combined 形式のアクセスログ）
# 401: パスワード誤り / 400: 再設定リンクの誤り / 429: 回数制限・ロック
# auth/refresh・auth/me は画面やアプリが普段から呼ぶので数えない

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "POST /v1/api/(?:auth/login|auth/password-reset(?:/confirm)?|lab/set-password) [^"]*" (?:400|401|429) 
ignoreregex =
datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}

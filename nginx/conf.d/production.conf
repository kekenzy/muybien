# 本番 Nginx — muybien.jp
# SSL: Let's Encrypt（/etc/letsencrypt を docker-compose.prod.yml でマウント）

server {
    listen 80;
    server_name muybien.jp www.muybien.jp;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name muybien.jp www.muybien.jp;
    client_max_body_size 20m;

    # セキュリティヘッダー（API の応答・SPA の HTML の両方に付く。location 側で add_header を書くと
    # ここの指定が引き継がれなくなるので、足すときはここにまとめる）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_certificate /etc/letsencrypt/live/muybien.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muybien.jp/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /v1/api/ {
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django も同じヘッダーを付けるので、重複しないよう上の add_header の値に揃える
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /admin/ {
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django も同じヘッダーを付けるので、重複しないよう上の add_header の値に揃える
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /static/ {
        alias /var/www/myapp-api/staticfiles/;
    }

    # 日記・メモ・タスクの写真は署名付きURL（/v1/api/lab/photos）経由でのみ配信する
    location ~ ^/media/(diary|memo|task)/ {
        return 404;
    }

    location /media/ {
        alias /var/www/myapp-api/media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

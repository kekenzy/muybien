# 本番 Nginx — muybien.jp
# SSL: Let's Encrypt（/etc/letsencrypt を docker-compose.prod.yml でマウント）

server {
    listen 80;
    server_name muybien.jp www.muybien.jp;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name muybien.jp www.muybien.jp;

    ssl_certificate /etc/letsencrypt/live/muybien.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muybien.jp/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /v1/api/ {
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/myapp-api/staticfiles/;
    }

    location /media/ {
        alias /var/www/myapp-api/media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

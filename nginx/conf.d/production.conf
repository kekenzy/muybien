# 本番 Nginx — muybien.jp
# SSL: Let's Encrypt（/etc/letsencrypt を docker-compose.prod.yml でマウント）

# 回数制限（IP ごと）。超えた分は 429 を返し、error.log に "limiting requests" が出る。
# fail2ban（deploy/fail2ban/）がそのログを見て、繰り返す IP を遮断して通知する。
# api: 写真の一覧などで一度に多く読むため、普段は届かない幅（毎秒20・まとめて100まで）にしている
# auth: ログイン・パスワード再設定・お問い合わせ（毎分30・まとめて10まで）。Django 側の制限より緩く、Django より先に機械的な連打を止める
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name muybien.jp www.muybien.jp;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name muybien.jp www.muybien.jp;
    client_max_body_size 20m;

    # セキュリティヘッダー（API の応答・SPA の HTML の両方に付く。location 側で add_header を書くと
    # ここの指定が引き継がれなくなるので、足すときはここにまとめる）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 読み込んでよい先を限る。外部は Google Fonts・Stripe（カード登録）・S3（日記などの写真の署名付き URL）だけ。
    # style の 'unsafe-inline' は /picsco/ の静的ページの <style> と style 属性のため
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.amazonaws.com https://*.stripe.com; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    ssl_certificate /etc/letsencrypt/live/muybien.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muybien.jp/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # 標準出力（docker logs）に加え、fail2ban が読むファイルにも書く（ホストの /var/log/muybien-nginx）
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/muybien/access.log combined;
    error_log /var/log/nginx/error.log;
    error_log /var/log/nginx/muybien/error.log warn;

    # auth/me・auth/refresh は画面やアプリが頻繁に呼ぶので入れない
    location ~ ^/v1/api/(auth/login|auth/password-reset(/confirm)?|auth/change-password|lab/set-password|contact)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /v1/api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django も同じヘッダーを付けるので、重複しないよう上の add_header の値に揃える
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /admin/ {
        proxy_pass http://myapp-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Django も同じヘッダーを付けるので、重複しないよう上の add_header の値に揃える
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /static/ {
        alias /var/www/myapp-api/staticfiles/;
    }

    # 日記・メモ・タスクの写真は署名付きURL（/v1/api/lab/photos）経由でのみ配信する
    location ~ ^/media/(diary|memo|task)/ {
        return 404;
    }

    location /media/ {
        alias /var/www/myapp-api/media/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

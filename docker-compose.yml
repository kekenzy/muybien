version: "3.9"

services:
  myapp-api:
    container_name: muybien-api
    build: ./myapp-api
    command: sh -c "sleep 3 && sh runserver.sh"
    volumes:
      - ./myapp-api/django:/root/myapp-api
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.environments.local
      - SECRET_KEY=dev-insecure-secret-key-for-local-only
      - RDS_DB_NAME=muybiendb
      - RDS_USERNAME=postgres
      - RDS_PASSWORD=password
      - RDS_HOSTNAME=myapp-db
      - RDS_PORT=5432
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=myapp-mailpit
      - EMAIL_PORT=1025
      - EMAIL_USE_TLS=False
    depends_on:
      - myapp-db
      - myapp-mailpit
    networks: [muybien-network]

  myapp-web:
    container_name: muybien-web
    build: ./myapp-web
    command: sh -c "npm run dev"
    volumes:
      - ./myapp-web/app:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks: [muybien-network]

  myapp-mailpit:
    image: axllent/mailpit
    container_name: muybien-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [muybien-network]

  myapp-db:
    profiles: [db]
    image: postgres:16.2
    container_name: muybien-db
    environment:
      - POSTGRES_DB=muybiendb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "15433:5432"
    volumes:
      - database:/var/lib/postgresql/data
      - ./myapp-db/conf/postgresql.conf:/etc/postgresql.conf
    networks: [muybien-network]

volumes:
  database:
  node_modules:

networks:
  muybien-network:
    driver: bridge

version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: muybien-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./myapp-web/app/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/var/www/myapp-api/staticfiles:ro
    depends_on:
      - myapp-api
    networks: [muybien-network]

  myapp-api:
    container_name: muybien-api
    build:
      context: ./myapp-api
      dockerfile: Dockerfile_prd
    command: >
      sh -c "
      sleep 5 &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
      "
    volumes:
      - ./myapp-api/django:/root/myapp-api
      - static_volume:/root/myapp-api/staticfiles
    expose:
      - "8000"
    env_file: .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.environments.production
    depends_on:
      myapp-db:
        condition: service_healthy
    networks: [muybien-network]

  myapp-db:
    image: postgres:16.2
    container_name: muybien-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env.prod
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [muybien-network]

volumes:
  postgres_data:
  static_volume:

networks:
  muybien-network:
    driver: bridge
